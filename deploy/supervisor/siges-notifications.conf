[program:siges-notifications]
directory=/var/www/siges
command=php artisan queue:work database --queue=notifications --sleep=3 --tries=3 --timeout=120 --backoff=60 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=/var/log/siges/notifications.log
stopasgroup=true
killasgroup=true
